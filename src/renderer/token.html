<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>WaniKani Widget — API token</title>
  <link rel="stylesheet" href="token.css">
</head>
<body>
  <form id="form">
    <p>Paste your WaniKani personal access token. A token with default (read-only) permissions is enough.</p>
    <p><a href="#" id="link">Create a token on WaniKani</a></p>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="API token" autofocus>
    <div class="row">
      <span id="error" class="error" role="alert"></span>
      <button id="save" type="submit">Save</button>
    </div>
  </form>
  <script type="module" src="token.js"></script>
</body>
</html>
